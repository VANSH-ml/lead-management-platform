<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vanshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f766e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Polygon Background Badge -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#vanshGrad)" filter="url(#shadow)" />
    
    <!-- Stylized 'V' Monogram -->
    <path d="M 22 24 L 40 60 L 58 24 L 48 24 L 40 42 L 32 24 Z" fill="#ffffff" />
    <path d="M 40 60 L 46 48 L 52 60 Z" fill="#6366f1" opacity="0.4" />
    <!-- Dynamic Dot -->
    <circle cx="58" cy="24" r="4.5" fill="#38bdf8" />
  </g>

  <!-- Text Branding -->
  <text x="105" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em" fill="url(#textGrad)">
    VANSH
  </text>
  <text x="232" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="0.05em" fill="#0f766e">
    CRM
  </text>
  <text x="106" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.18em" fill="#6b7280">
    BY VANSH WADHWANI
  </text>
</svg>
